openapi: 3.1.0
info:
  title: CloudSSH Ops Gateway
  version: 0.3.0
  description: Controlled operations API for servers saved and trusted in CloudSSH.
servers:
  - url: https://YOUR_CLOUDSSH_DOMAIN
security:
  - bearerAuth: []
paths:
  /api/ops/health:
    get:
      operationId: opsHealth
      summary: Check whether the operations gateway is configured and authenticated.
      responses:
        '200':
          description: Gateway is ready.
        '401':
          description: Invalid bearer credential.
        '503':
          description: Gateway environment variables are not configured.
  /api/ops/servers:
    get:
      operationId: listOpsServers
      summary: List non-secret metadata for servers owned by the configured CloudSSH account.
      responses:
        '200':
          description: Saved servers.
        '401':
          description: Invalid bearer credential.
  /api/ops/check:
    post:
      operationId: checkOpsCommand
      summary: Classify a command with CloudSSH's safety policy without opening an SSH session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 32768
              required: [command]
              additionalProperties: false
      responses:
        '200':
          description: Safety classification for the command.
        '400':
          description: Invalid command body.
        '401':
          description: Invalid bearer credential.
  /api/ops/exec:
    post:
      operationId: executeOpsCommand
      summary: Execute one shell command on a saved CloudSSH server through the existing SSH exec channel.
      description: Safety classification happens before any SSH session is opened. Permanently blocked commands return 403, and confirmation-required commands return 409 unless approve_risk=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server_id:
                  type: integer
                  minimum: 1
                command:
                  type: string
                  minLength: 1
                  maxLength: 32768
                timeout_ms:
                  type: integer
                  minimum: 1000
                  maximum: 180000
                  default: 30000
                approve_risk:
                  type: boolean
                  default: false
              required: [server_id, command]
              additionalProperties: false
      responses:
        '200':
          description: Command completed.
        '401':
          description: Invalid bearer credential.
        '403':
          description: Command is permanently blocked by the CloudSSH safety policy.
        '409':
          description: Host trust is incomplete or this command requires explicit human approval.
        '504':
          description: SSH connection or command execution timed out.
  /api/ops/run:
    post:
      operationId: runOpsPlan
      summary: Execute a bounded ordered deployment or validation plan on one saved server.
      description: Every step is safety-preflighted before any SSH connection is opened. Risk approval is scoped to each step. By default execution stops after the first non-zero exit code. Each step currently uses an isolated short-lived SSH session so one failed session cannot poison later execution state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server_id:
                  type: integer
                  minimum: 1
                stop_on_error:
                  type: boolean
                  default: true
                steps:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 80
                      command:
                        type: string
                        minLength: 1
                        maxLength: 32768
                      timeout_ms:
                        type: integer
                        minimum: 1000
                        maximum: 180000
                        default: 30000
                      approve_risk:
                        type: boolean
                        default: false
                    required: [command]
                    additionalProperties: false
              required: [server_id, steps]
              additionalProperties: false
      responses:
        '200':
          description: Plan execution result, including ordered per-step stdout, stderr, and exit_code.
        '400':
          description: Invalid plan or plan exceeds bounded size/time budgets.
        '401':
          description: Invalid bearer credential.
        '403':
          description: At least one step is permanently blocked by the safety policy. No SSH session is opened.
        '409':
          description: Host trust is incomplete or at least one step requires explicit human approval. No plan step is executed.
        '502':
          description: SSH transport failed while running a step. Partial results are returned.
        '504':
          description: A step timed out. Partial results are returned.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque